services:
  - type: web
    name: leilao-api
    runtime: node
    plan: free
    region: ohio
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:deploy
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: TZ
        value: UTC
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: HMAC_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: MIN_DEPOSIT_CENTS
        value: "1"
      - key: MAX_DEPOSIT_CENTS
        value: "100000000000"
      - key: MAX_WALLET_CENTS
        value: "9223372036854775807"
