version: "3.9"

services:
  # ─── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: leilao
      POSTGRES_USER: leilao
      POSTGRES_PASSWORD: leilao123
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leilao -d leilao"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── Back-end: migra + seed (roda uma vez e sai) ─────────────────────────────
  migrate:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      # Dentro do Docker o banco é acessível pelo nome do serviço "db", não localhost
      DATABASE_URL: postgres://leilao:leilao123@db:5432/leilao
    command: >
      sh -c "npm install && npm run migrate && npm run seed"
    restart: "no"

  # ─── Back-end (API Express) ──────────────────────────────────────────────────
  backend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file:
      - ./backend/.env
    environment:
      # Dentro do Docker o banco e o CORS mudam de hostname
      DATABASE_URL: postgres://leilao:leilao123@db:5432/leilao
      FRONTEND_URL: http://localhost:5173
    ports:
      - "3000:3000"
    command: >
      sh -c "npm install && npx tsx src/server.ts"

  # ─── Front-end (Vite dev server) ─────────────────────────────────────────────
  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    depends_on:
      - backend
    env_file:
      - ./frontend/.env
    ports:
      - "5173:5173"
    command: >
      sh -c "npm install && npx vite --host 0.0.0.0"

volumes:
  pgdata:

