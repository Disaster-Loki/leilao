services:
  # ─── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: leilao
      POSTGRES_USER: leilao
      POSTGRES_PASSWORD: leilao123
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # 5433 no host para não colidir com um PostgreSQL local na 5432.
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leilao -d leilao"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── Back-end: migra + seed (roda uma vez e sai) ─────────────────────────────
  # Os segredos abaixo são apenas para desenvolvimento local. Para produção,
  # use as variáveis do serviço (ver README → Deploy).
  migrate:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://leilao:leilao123@db:5432/leilao
      JWT_SECRET: dev-jwt-secret-change-me
      HMAC_SECRET: dev-hmac-secret-change-me
      FRONTEND_URL: http://localhost:5173
      PORT: 3000
    command: >
      sh -c "npm ci && npm run reset && npm run migrate && npm run seed"
    restart: "no"

  # ─── Back-end (API Express) ──────────────────────────────────────────────────
  backend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://leilao:leilao123@db:5432/leilao
      JWT_SECRET: dev-jwt-secret-change-me
      HMAC_SECRET: dev-hmac-secret-change-me
      FRONTEND_URL: http://localhost:5173
      PORT: 3000
    ports:
      - "3000:3000"
    command: >
      sh -c "npm ci && npx tsx src/server.ts"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # ─── Front-end (Vite dev server) ─────────────────────────────────────────────
  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    depends_on:
      backend:
        condition: service_healthy
    environment:
      API_URL: http://localhost:3000
    ports:
      - "5173:5173"
    command: >
      sh -c "npm ci && npx vite --host 0.0.0.0"
    restart: unless-stopped

volumes:
  pgdata:
